<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำนวณรายได้/กำไร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Kanit', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen">
    <header class="bg-indigo-700 text-white p-5 shadow-lg sticky top-0 z-10">
        <div class="container mx-auto flex flex-col md:flex-row gap-3 md:items-center md:justify-between">
            <h1 class="text-2xl font-bold">🧮 หน้าคำนวณรายได้/ทุน/กำไร</h1>
            <div class="flex gap-2">
                <a href="/index.html" class="px-4 py-2 rounded-lg bg-white/15 hover:bg-white/25 transition">← กลับหน้าคลังยา</a>
                <button id="addRowBtn" class="px-4 py-2 rounded-lg bg-emerald-500 hover:bg-emerald-600 transition font-semibold">+ เพิ่มบรรทัด</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4 space-y-4">
        <section class="grid grid-cols-1 md:grid-cols-4 gap-3">
            <div class="bg-white rounded-xl p-4 shadow">
                <div class="text-sm text-slate-500">ยอดขายรวม</div>
                <div id="totalRevenue" class="text-2xl font-bold text-indigo-700">0.00 ฿</div>
            </div>
            <div class="bg-white rounded-xl p-4 shadow">
                <div class="text-sm text-slate-500">ทุนรวม</div>
                <div id="totalCost" class="text-2xl font-bold text-blue-700">0.00 ฿</div>
            </div>
            <div class="bg-white rounded-xl p-4 shadow">
                <div class="text-sm text-slate-500">กำไรรวม</div>
                <div id="totalProfit" class="text-2xl font-bold text-emerald-700">0.00 ฿</div>
            </div>
            <div class="bg-white rounded-xl p-4 shadow">
                <div class="text-sm text-slate-500">Margin รวม</div>
                <div id="totalMargin" class="text-2xl font-bold text-violet-700">0.00%</div>
            </div>
        </section>

        <section class="bg-white rounded-xl shadow overflow-hidden overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-slate-200">
                    <tr>
                        <th class="p-3">ชื่อยา</th>
                        <th class="p-3">หมวด</th>
                        <th class="p-3">ทุน/หน่วย</th>
                        <th class="p-3">ราคาขาย/หน่วย</th>
                        <th class="p-3">จำนวน</th>
                        <th class="p-3">ยอดขาย</th>
                        <th class="p-3">ทุน</th>
                        <th class="p-3">กำไร</th>
                        <th class="p-3 w-0"></th>
                    </tr>
                </thead>
                <tbody id="calcTableBody" class="divide-y divide-slate-100"></tbody>
            </table>
        </section>
    </main>

    <script>
        let catalog = [];

        function parseNum(value) {
            const cleaned = String(value ?? "").replace(/,/g, "").trim();
            const num = parseFloat(cleaned);
            return Number.isFinite(num) ? num : 0;
        }

        function formatMoney(value) {
            return `${value.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ฿`;
        }

        function buildDrugOptions() {
            return catalog.map((drug, index) => `<option value="${index}">${escapeHtml(drug.name)}</option>`).join("");
        }

        function escapeHtml(text) {
            return String(text ?? "").replace(/[&<>"']/g, (ch) => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "\"": "&quot;",
                "'": "&#39;"
            }[ch]));
        }

        function createRow(initialIndex = 0) {
            const tbody = document.getElementById('calcTableBody');
            const tr = document.createElement('tr');
            tr.className = "hover:bg-slate-50";
            tr.innerHTML = `
                <td class="p-3">
                    <select class="drugSelect w-full border rounded-lg px-2 py-1 bg-white">${buildDrugOptions()}</select>
                </td>
                <td class="p-3 text-sm text-slate-600 categoryCell">-</td>
                <td class="p-3"><input type="number" step="0.01" class="costInput w-28 border rounded-lg px-2 py-1" value="0"></td>
                <td class="p-3"><input type="number" step="0.01" class="sellInput w-28 border rounded-lg px-2 py-1" value="0"></td>
                <td class="p-3"><input type="number" step="1" min="1" class="qtyInput w-20 border rounded-lg px-2 py-1" value="1"></td>
                <td class="p-3 revenueCell font-medium text-indigo-700">0.00 ฿</td>
                <td class="p-3 costCell font-medium text-blue-700">0.00 ฿</td>
                <td class="p-3 profitCell font-bold text-emerald-700">0.00 ฿</td>
                <td class="p-3">
                    <button class="removeRowBtn text-red-600 hover:bg-red-50 px-2 py-1 rounded">ลบ</button>
                </td>
            `;
            tbody.appendChild(tr);

            const select = tr.querySelector('.drugSelect');
            const costInput = tr.querySelector('.costInput');
            const sellInput = tr.querySelector('.sellInput');
            const qtyInput = tr.querySelector('.qtyInput');

            function setFromDrug(index) {
                const drug = catalog[index];
                if (!drug) return;
                tr.querySelector('.categoryCell').textContent = drug.category || "-";
                const cost = parseNum(drug.want);
                const defaultSell = cost + parseNum(drug.profit);
                costInput.value = cost.toFixed(2);
                sellInput.value = defaultSell.toFixed(2);
                recalcRow(tr);
            }

            select.addEventListener('change', () => setFromDrug(parseInt(select.value, 10)));
            costInput.addEventListener('input', () => recalcRow(tr));
            sellInput.addEventListener('input', () => recalcRow(tr));
            qtyInput.addEventListener('input', () => recalcRow(tr));
            tr.querySelector('.removeRowBtn').addEventListener('click', () => {
                tr.remove();
                recalcTotals();
            });

            if (catalog.length > 0) {
                select.value = String(Math.max(0, Math.min(initialIndex, catalog.length - 1)));
                setFromDrug(parseInt(select.value, 10));
            } else {
                recalcRow(tr);
            }
        }

        function recalcRow(tr) {
            const cost = parseNum(tr.querySelector('.costInput').value);
            const sell = parseNum(tr.querySelector('.sellInput').value);
            const qty = Math.max(1, parseInt(tr.querySelector('.qtyInput').value || "1", 10) || 1);
            tr.querySelector('.qtyInput').value = qty;

            const rowRevenue = sell * qty;
            const rowCost = cost * qty;
            const rowProfit = rowRevenue - rowCost;

            tr.dataset.revenue = String(rowRevenue);
            tr.dataset.cost = String(rowCost);
            tr.dataset.profit = String(rowProfit);

            tr.querySelector('.revenueCell').textContent = formatMoney(rowRevenue);
            tr.querySelector('.costCell').textContent = formatMoney(rowCost);
            tr.querySelector('.profitCell').textContent = formatMoney(rowProfit);
            recalcTotals();
        }

        function recalcTotals() {
            const rows = Array.from(document.querySelectorAll('#calcTableBody tr'));
            let totalRevenue = 0;
            let totalCost = 0;
            let totalProfit = 0;

            rows.forEach((row) => {
                totalRevenue += parseNum(row.dataset.revenue);
                totalCost += parseNum(row.dataset.cost);
                totalProfit += parseNum(row.dataset.profit);
            });

            const margin = totalRevenue > 0 ? (totalProfit / totalRevenue) * 100 : 0;
            document.getElementById('totalRevenue').textContent = formatMoney(totalRevenue);
            document.getElementById('totalCost').textContent = formatMoney(totalCost);
            document.getElementById('totalProfit').textContent = formatMoney(totalProfit);
            document.getElementById('totalMargin').textContent = `${margin.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}%`;
        }

        async function loadCatalog() {
            const response = await fetch('/api/drugs');
            const rawData = await response.json();
            const items = [];
            Object.keys(rawData || {}).forEach((category) => {
                if (!Array.isArray(rawData[category])) return;
                rawData[category].forEach((item) => {
                    if (!item?.name) return;
                    items.push({
                        name: item.name,
                        category,
                        want: item.want,
                        profit: item.profit
                    });
                });
            });
            catalog = items.sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), 'th'));
        }

        async function init() {
            try {
                await loadCatalog();
                createRow(0);
                createRow(1);
            } catch (error) {
                console.error(error);
                alert("โหลดข้อมูลยาไม่สำเร็จ");
            }
        }

        document.getElementById('addRowBtn').addEventListener('click', () => createRow(0));
        init();
    </script>
</body>
</html>
